name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Build demo pages
        run: |
          fairyview presets
          fairyview init --preset benchmark --path examples/benchmark_demo.jsonl --out /tmp/preset.toml
          fairyview try --config /tmp/preset.toml --limit 1
          fairyview build --config examples/demo.toml --out /tmp/demo
          fairyview build --config examples/benchmark.toml --out /tmp/bench
          fairyview build --config examples/inference.toml --out /tmp/infer
          node --check /tmp/demo/app.js
          node --check /tmp/bench/app.js
      - name: Build the wheel and check bundled assets
        run: |
          pip install build
          python -m build --wheel
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); n=z.namelist(); assert any('_template/page.html' in x for x in n), n; assert any('_presets/benchmark.toml' in x for x in n), n"
